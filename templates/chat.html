{% extends "layout.html" %}
{% block content %}

<style>
.chat-wrap { max-width: 780px; margin: 0 auto; display: flex;
             flex-direction: column; min-height: calc(100vh - 200px); }
.chat-log  { flex: 1; display: flex; flex-direction: column; gap: 1rem;
             padding-bottom: 1.5rem; }
.msg { max-width: 92%; padding: 0.8rem 1.1rem; border-radius: 14px;
       font-size: 0.92rem; line-height: 1.55; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff;
            border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.assistant { align-self: flex-start; background: var(--s1);
                 border: 1px solid var(--border);
                 border-bottom-left-radius: 4px; }
.msg.assistant table { font-size: 0.85rem; margin: 0.6rem 0; }
.msg.assistant th, .msg.assistant td { padding: 0.35rem 0.6rem;
                 border: 1px solid var(--border); }
.msg.assistant p { margin: 0.4rem 0; }
.msg.assistant ul, .msg.assistant ol { margin: 0.4rem 0 0.4rem 1.2rem; }
.msg.assistant code { background: var(--s2); padding: 0.1rem 0.3rem;
                 border-radius: 4px; font-size: 0.85em; }
.msg.error { align-self: center; background: var(--red-bg); color: var(--red);
             font-size: 0.85rem; }
.chat-hint { text-align: center; color: var(--muted); font-size: 0.85rem;
             margin: 2.5rem 0; }
.chat-hint .suggestions { display: flex; flex-wrap: wrap; gap: 0.5rem;
             justify-content: center; margin-top: 1rem; }
.chat-hint button { background: var(--s1); border: 1px solid var(--border);
             color: var(--text); border-radius: 99px; padding: 0.45rem 0.9rem;
             font-size: 0.8rem; cursor: pointer; font-family: var(--font); }
.chat-hint button:hover { border-color: var(--accent); color: var(--accent); }
.chat-input { position: sticky; bottom: 0; background: var(--bg);
              padding: 0.75rem 0 1.25rem; display: flex; gap: 0.5rem; }
.chat-input textarea { flex: 1; resize: none; min-height: 48px; max-height: 160px;
              border-radius: 12px; }
.chat-input button { background: var(--accent); color: #fff; border: none;
              border-radius: 12px; width: 48px; cursor: pointer;
              display: flex; align-items: center; justify-content: center; }
.chat-input button:disabled { opacity: 0.4; cursor: default; }
.typing { color: var(--muted); font-size: 0.8rem; padding-left: 0.3rem; }
</style>

<div class="chat-wrap">
  <div class="chat-log" id="log">
    <div class="chat-hint" id="hint">
      <div>Consultor do projecto Casa Nova — pergunta-me sobre orçamento,
      fases da obra, riscos ou o que precisares.</div>
      <div class="suggestions">
        <button onclick="ask(this.textContent)">Como está a saúde financeira do projecto?</button>
        <button onclick="ask(this.textContent)">Que categorias estão em risco de derrapar?</button>
        <button onclick="ask(this.textContent)">Tenho liquidez para acabar a obra?</button>
        <button onclick="ask(this.textContent)">O que devo contratar a seguir?</button>
      </div>
    </div>
  </div>
  <div class="chat-input">
    <textarea id="input" rows="1" placeholder="Escreve a tua pergunta…"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
    <button id="sendBtn" onclick="send()" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
        <path d="M1.7 8L14.3 1.9c.5-.2 1 .3.8.8L10 14.3c-.2.5-.9.5-1.1 0L7 9.9a.6.6 0 00-.3-.3L1.7 7.5c-.5-.2-.5-.9 0-1.1z" transform="rotate(45 8 8)"/>
      </svg>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const history = [];   // {role, content} — full conversation, sent each turn
let busy = false;

function ask(q) { input.value = q; send(); }

function addMsg(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  if (cls === 'assistant') el.innerHTML = marked.parse(text);
  else el.textContent = text;
  log.appendChild(el);
  el.scrollIntoView({behavior: 'smooth', block: 'end'});
  return el;
}

async function send() {
  const q = input.value.trim();
  if (!q || busy) return;
  busy = true; sendBtn.disabled = true; input.value = '';
  document.getElementById('hint')?.remove();

  addMsg('user', q);
  history.push({role: 'user', content: q});

  const el = addMsg('assistant', '');
  el.innerHTML = '<span class="typing">a pensar…</span>';
  let acc = '';

  try {
    const resp = await fetch('/assistente/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: history}),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || ('HTTP ' + resp.status));
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const events = buf.split('\n\n');
      buf = events.pop();
      for (const ev of events) {
        if (!ev.startsWith('data: ')) continue;
        const d = JSON.parse(ev.slice(6));
        if (d.error) throw new Error(d.error);
        if (d.text) {
          acc += d.text;
          el.innerHTML = marked.parse(acc);
          el.scrollIntoView({block: 'end'});
        }
      }
    }
    history.push({role: 'assistant', content: acc});
  } catch (e) {
    el.remove();
    history.pop();  // remove the user turn that failed
    addMsg('error', '⚠ ' + e.message);
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}
</script>

{% endblock %}
